name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    name: 02 tests
    runs-on: ubuntu-24.04
    environment: ci-release
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: run the runner-a tests
        run: test "$(cat tests/outcome)" != fail
